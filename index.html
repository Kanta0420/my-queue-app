<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デジタル整理券</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    .number { font-size: 48px; font-weight: bold; color: #07c160; margin: 10px 0; }
    button { background: #07c160; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>順番待ち整理券</h2>
    <p>現在の受付番号</p>
    <div class="number" id="ticketNo">--</div>
    <button onclick="issueTicket()">整理券を発行する</button>
  </div>

  <script>
    function issueTicket() {
      const randomNum = Math.floor(Math.random() * 90) + 10;
      document.getElementById('ticketNo').innerText = randomNum;
      alert(`整理券番号 ${randomNum} 番を発行しました！`);
    }
  </script>
</body>
</html>
