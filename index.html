<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デジタル整理券</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 20px; background: #0f172a; color: #f8fafc; text-align: center; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-top: 20px; }
    h1 { font-size: 20px; color: #94a3b8; margin-bottom: 10px; }
    .number { font-size: 64px; font-weight: bold; color: #38bdf8; margin: 15px 0; }
    .status-box { background: #0f172a; padding: 15px; border-radius: 10px; margin: 15px 0; }
    .btn { background: #22c55e; color: white; border: none; padding: 16px 32px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(34,197,94,0.3); }
    .btn:disabled { background: #64748b; cursor: not-allowed; box-shadow: none; }
    .user-info { font-size: 14px; color: #38bdf8; margin-top: 10px; }
  </style>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

  <div class="card">
    <h1 id="shopName">読み込み中...</h1>
    
    <div class="status-box">
      <div>現在の呼び出し番号</div>
      <div id="currentNo" class="number" style="font-size: 48px; color: #f59e0b;">-</div>
    </div>

    <div id="ticketArea">
      <p>整理券を発行して順番をお待ちください。</p>
      <div id="userInfo" class="user-info">LINEアカウント読み込み中...</div>
      <br>
      <button id="issueBtn" class="btn" onclick="issueTicket()" disabled>読み込み中...</button>
    </div>

    <div id="myTicketArea" style="display: none; margin-top: 20px; border-top: 1px solid #334155; padding-top: 20px;">
      <p>あなたの受付番号</p>
      <div id="myNo" class="number">-</div>
      <p id="waitCount" style="color: #38bdf8; font-weight: bold;">あと - 組でお呼び出しです</p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const LIFF_ID = "2011502822-9gjbFKnE";

    const firebaseConfig = {
      apiKey: "AIzaSyAtML5QTMDkhUZfb9MZoAt4Nt0ue2SNd7E",
      authDomain: "qr-customer-call.firebaseapp.com",
      projectId: "qr-customer-call",
      storageBucket: "qr-customer-call.firebasestorage.app",
      messagingSenderId: "809125472107",
      appId: "1:809125472107:web:f25fd8367ab69728bc8e2e",
      measurementId: "G-VT8ZHEXYMX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('shop') || 'shop1';
    let myNumber = null;
    let lineUserId = null;

    const shopRef = db.collection('queueShops').doc(shopId);

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
          document.getElementById('userInfo').innerText = `👤 ${profile.displayName} 様として発券`;
          document.getElementById('issueBtn').disabled = false;
          document.getElementById('issueBtn').innerText = "整理券を発行する";
        } else {
          liff.login();
        }
      } catch (err) {
        console.error("LIFF Error", err);
        document.getElementById('userInfo').innerText = "※LINE非連携モード";
        document.getElementById('issueBtn').disabled = false;
        document.getElementById('issueBtn').innerText = "整理券を発行する";
      }
    }

    shopRef.onSnapshot((doc) => {
      if (!doc.exists) {
        document.getElementById('shopName').innerText = "店舗情報が見つかりません";
        return;
      }
      const data = doc.data();
      document.getElementById('shopName').innerText = data.name || "店舗1";
      document.getElementById('currentNo').innerText = data.current + " 番";

      if (myNumber !== null) {
        const wait = myNumber - data.current;
        if (wait > 0) {
          document.getElementById('waitCount').innerText = `あと ${wait} 組でお呼び出しです`;
        } else if (wait === 0) {
          document.getElementById('waitCount').innerText = "🎉 お呼び出し中！窓口へお越しください";
        } else {
          document.getElementById('waitCount').innerText = "ご案内が完了しました";
        }
      }
    });

    async function issueTicket() {
      document.getElementById('issueBtn').disabled = true;

      await db.runTransaction(async (transaction) => {
        const sfDoc = await transaction.get(shopRef);
        if (!sfDoc.exists) {
          transaction.set(shopRef, { name: '店舗1', current: 0, max: 1, skips: [] });
          myNumber = 1;
        } else {
          const newMax = (sfDoc.data().max || 0) + 1;
          transaction.update(shopRef, { max: newMax });
          myNumber = newMax;
        }

        if (lineUserId) {
          const ticketRef = shopRef.collection('tickets').doc(String(myNumber));
          transaction.set(ticketRef, { lineUserId: lineUserId, createdAt: new Date() });
        }
      });

      document.getElementById('ticketArea').style.display = 'none';
      document.getElementById('myTicketArea').style.display = 'block';
      document.getElementById('myNo').innerText = myNumber + " 番";
    }

    initLiff();
  </script>
</body>
</html>
