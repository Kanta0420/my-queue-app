<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デジタル整理券 発券</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 20px; background: #0f172a; color: #f8fafc; text-align: center; }
    .card { background: #1e293b; padding: 30px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h1 { font-size: 20px; color: #38bdf8; margin-bottom: 20px; }
    .btn-issue { background: #22c55e; color: white; border: none; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 14px; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(34,197,94,0.3); margin-top: 15px; }
    .btn-issue:disabled { background: #64748b; box-shadow: none; cursor: not-allowed; }
    .ticket-box { background: #0f172a; border: 2px dashed #38bdf8; padding: 20px; border-radius: 14px; margin-top: 20px; }
    .ticket-num { font-size: 48px; font-weight: bold; color: #38bdf8; }
    .status-msg { margin-top: 15px; font-size: 13px; color: #f59e0b; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="shopTitle">店舗 整理券発行</h1>
    
    <div id="issueSection">
      <p style="font-size: 14px; color: #94a3b8;">下のボタンを押して整理券を発行してください。</p>
      <button class="btn-issue" id="issueBtn" onclick="issueTicket()" disabled>読み込み中...</button>
    </div>

    <div id="ticketSection" class="ticket-box" style="display: none;">
      <p style="font-size: 12px; color: #94a3b8; margin: 0;">あなたの整理券番号</p>
      <div class="ticket-num" id="myNumber">- 番</div>
      <p style="font-size: 12px; color: #22c55e; margin-top: 5px;">順番が近づいたらLINEで通知が届きます。</p>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyAtML5QTMDkhUZfb9MZoAt4Nt0ue2SNd7E",
      authDomain: "qr-customer-call.firebaseapp.com",
      projectId: "qr-customer-call",
      storageBucket: "qr-customer-call.firebasestorage.app",
      messagingSenderId: "809125472107",
      appId: "1:809125472107:web:f25fd8367ab69728bc8e2e",
      measurementId: "G-VT8ZHEXYMX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('shop') || 'shop1';

    let lineUserId = "";

    window.onload = function() {
      // ⚠️ ここをご自身の LIFF ID（例: "2001234567-xxxxxx"）に変更してください！
      const MY_LIFF_ID = "YOUR_LIFF_ID"; 

      liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            // 未ログインの場合は、現在のURL（?shop=shop1 を保持）を保持してログイン
            liff.login({ redirectUri: window.location.href });
          } else {
            // ログイン済みならプロフィールから User ID を取得
            liff.getProfile().then(profile => {
              lineUserId = profile.userId;
              showStatus(`✅ LINE連携完了: ${lineUserId.slice(0, 8)}...`);
              enableButton();
            }).catch(err => {
              console.error("Profile Error:", err);
              showStatus("⚠️ プロフィール取得失敗");
              enableButton();
            });
          }
        })
        .catch(err => {
          console.error("LIFF Init Error:", err);
          showStatus("⚠️ LIFF初期化エラー（LIFF IDを確認してください）");
          enableButton();
        });
    };

    function enableButton() {
      const btn = document.getElementById('issueBtn');
      btn.innerText = "整理券を発行する";
      btn.disabled = false;
    }

    function showStatus(msg) {
      document.getElementById('statusMsg').innerText = msg;
    }

    // 発券処理
    async function issueTicket() {
      const btn = document.getElementById('issueBtn');
      btn.disabled = true;
      btn.innerText = "発行中...";

      const ref = db.collection('queueShops').doc(shopId);

      try {
        await db.runTransaction(async (transaction) => {
          const doc = await transaction.get(ref);
          let newMax = 1;

          if (doc.exists) {
            newMax = (doc.data().max || 0) + 1;
            transaction.update(ref, { max: newMax });
          } else {
            transaction.set(ref, { name: '店舗', current: 0, max: 1, skips: [] });
          }

          document.getElementById('myNumber').innerText = `${newMax} 番`;
          document.getElementById('issueSection').style.display = 'none';
          document.getElementById('ticketSection').style.display = 'block';

          if (lineUserId) {
            showStatus(`✅ 発券完了（LINE ID: ${lineUserId.slice(0, 8)}...）`);
          } else {
            showStatus("⚠️ LINE未連携のまま発券されました");
          }
        });
      } catch (err) {
        console.error("Issue Error:", err);
        showStatus("❌ 発券エラー。再読み込みしてください。");
        enableButton();
      }
    }
  </script>
</body>
</html>
