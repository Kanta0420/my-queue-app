<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デジタル整理券 発券</title>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; background-color: #f9f9f9; }
    .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); max-width: 400px; margin: 0 auto; }
    h1 { font-size: 24px; color: #333; margin-bottom: 10px; }
    p { color: #666; font-size: 14px; }
    .btn { background-color: #06C755; color: white; border: none; padding: 16px 30px; font-size: 18px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; box-shadow: 0 4px 6px rgba(6,199,85,0.3); }
    .btn:disabled { background-color: #ccc; box-shadow: none; cursor: not-allowed; }
    .status-box { margin-top: 20px; padding: 10px; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>順番整理券</h1>
    <p>下のボタンを押して整理券を発行してください</p>

    <button id="issue-btn" class="btn" onclick="issueTicket()" disabled>LINE確認中...</button>

    <div id="status-msg" class="status-box"></div>
  </div>

  <script>
    const MY_LIFF_ID = "2011502822-9gjbFKnE";
    let lineUserId = null;

    function showStatus(text, color = "#666") {
      const el = document.getElementById("status-msg");
      el.innerText = text;
      el.style.color = color;
    }

    // LIFF初期化処理
    async function initLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineUserId = profile.userId;

        const btn = document.getElementById("issue-btn");
        btn.disabled = false;
        btn.innerText = "整理券を発行する";
        showStatus("✅ LINE連携完了", "#06C755");

      } catch (err) {
        console.error("LIFF Init Error:", err);
        showStatus("⚠️ LIFFエラー: " + (err.message || "初期化に失敗しました"), "red");
        const btn = document.getElementById("issue-btn");
        btn.disabled = false;
        btn.innerText = "整理券を発行する (LINE通知なし)";
      }
    }

    // 発券処理
    async function issueTicket() {
      const btn = document.getElementById("issue-btn");
      btn.disabled = true;
      btn.innerText = "発行中...";

      try {
        const response = await fetch('/api/issue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: lineUserId
          })
        });

        const data = await response.json();
        if (response.ok) {
          alert(`整理券番号【 ${data.number} 番 】を発行しました！`);
          showStatus(`あなたの番号: ${data.number} 番`, "#333");
          btn.innerText = "発行完了";
        } else {
          alert("発券エラー: " + (data.error || "失敗しました"));
          btn.disabled = false;
          btn.innerText = "整理券を発行する";
        }
      } catch (err) {
        alert("通信エラーが発生しました");
        btn.disabled = false;
        btn.innerText = "整理券を発行する";
      }
    }

    window.onload = initLiff;
  </script>
</body>
</html>
